<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="pdf.min.js"></script>
</head>
<body>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

async function extract(url) {
    try {
        // XHR 读取本地 PDF（allowFileAccessFromFileURLs 已开启）
        const buf = await new Promise(function (resolve, reject) {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = function () {
                if (xhr.status === 0 || xhr.status === 200) resolve(xhr.response);
                else reject(new Error('HTTP ' + xhr.status));
            };
            xhr.onerror = function () { reject(new Error('读取文件失败')); };
            xhr.send();
        });
        const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        const total = doc.numPages;
        AndroidBridge.onInfo(total);
        for (let p = 1; p <= total; p++) {
            const page = await doc.getPage(p);
            const tc = await page.getTextContent();
            let s = '', lastY = null;
            for (const item of tc.items) {
                const y = item.transform[5];
                if (lastY !== null && Math.abs(y - lastY) > 2 && !s.endsWith('\n')) s += '\n';
                s += item.str;
                if (item.hasEOL) { s += '\n'; lastY = null; }
                else lastY = y;
            }
            AndroidBridge.onPage(p, total, s);
        }
        AndroidBridge.onDone('');
    } catch (e) {
        AndroidBridge.onDone(String(e && e.message || e));
    }
}
</script>
</body>
</html>
