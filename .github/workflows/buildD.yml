name: Build D (debug apk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Fix debug keystore (keep same signature across builds)
        run: |
          mkdir -p ~/.android
          cp $GITHUB_WORKSPACE/.github/debugD.keystore ~/.android/debug.keystore

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleAppDebug --build-cache --parallel --warning-mode all 2>&1 | tee build.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            {
              echo "## ❌ 编译错误汇总（给开发者的自动提取）"
              echo '```'
              grep -nE "^e: |error: |FAILURE: " build.log | head -60 || echo "未匹配到典型错误行，请下载完整日志"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -E "^e: " build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done || true
          exit $ec

      - name: Organize the Files
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          cp -rf ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk ${{ github.workspace }}/apk/

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado_D_debug_apk
          path: ${{ github.workspace }}/apk/*.apk
